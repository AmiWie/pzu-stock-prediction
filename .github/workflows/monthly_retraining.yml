name: Monthly Model Retrain

on:
  schedule:
    # W każdą pierwszą niedzielę miesiąca o godzinie 02:00 UTC
    - cron: '0 2 1-7 * 0'
  workflow_dispatch: # Opcja ręcznego uruchomienia przyciskiem "Run workflow"

jobs:
  retrain:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ponowny trening modelu (z RSI i wolumenem)
        run: |
          python src/train.py

      - name: Zapis zaktualizowanych wag i skalerów
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/model.pth models/feature_scaler.pkl models/target_scaler.pkl
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczny comiesięczny retrening modelu LSTM [skip ci]" && git push)