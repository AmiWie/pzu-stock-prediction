name: Daily Stock Prediction

on:
  schedule:
    - cron: '0 17 * * 1-5'  # Run at 5 PM every weekday
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction script
        run: |
          python src/predict.py
      
      - name: Commit and push predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja prognozy giełdowej [skip ci]" && git push)